<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="290" r="205" fill="#ffffff" opacity="0.08"/>
  <ellipse cx="256" cy="474" rx="132" ry="24" fill="#065f46" opacity="0.25"/>

  <!--MOTIF-->
  <g>
    <!-- sparkle -->
    <path d="M116 108 l12 26 28 9 -28 9 -12 26 -12 -26 -28 -9 28 -9 z" fill="#fef9c3" opacity="0.9"/>

    <!-- pig ears (behind head) -->
    <g transform="rotate(-26 170 212)">
      <ellipse cx="170" cy="212" rx="50" ry="66" fill="#fecdd3"/>
    </g>
    <g transform="rotate(26 342 212)">
      <ellipse cx="342" cy="212" rx="50" ry="66" fill="#fecdd3"/>
    </g>

    <!-- head -->
    <circle cx="256" cy="300" r="160" fill="#fff1f2"/>

    <!-- cheeks -->
    <ellipse cx="168" cy="344" rx="20" ry="12" fill="#fecdd3"/>
    <ellipse cx="344" cy="344" rx="20" ry="12" fill="#fecdd3"/>

    <!-- eyes -->
    <circle cx="206" cy="272" r="14" fill="#374151"/>
    <circle cx="306" cy="272" r="14" fill="#374151"/>
    <circle cx="211" cy="267" r="4" fill="#ffffff"/>
    <circle cx="311" cy="267" r="4" fill="#ffffff"/>

    <!-- snout -->
    <ellipse cx="256" cy="352" rx="76" ry="54" fill="#fbcfe8"/>
    <circle cx="232" cy="344" r="10" fill="#be185d" opacity="0.85"/>
    <circle cx="280" cy="344" r="10" fill="#be185d" opacity="0.85"/>

    <!-- smile -->
    <path d="M230 386 Q256 402 282 386" fill="none" stroke="#be185d" stroke-width="6" stroke-linecap="round"/>

    <!-- coin stack the pig is holding -->
    <g stroke="#b45309" stroke-width="4">
      <circle cx="392" cy="340" r="44" fill="url(#coin)"/>
      <circle cx="392" cy="392" r="44" fill="url(#coin)"/>
      <circle cx="392" cy="444" r="44" fill="url(#coin)"/>
    </g>
  </g>
</svg>
