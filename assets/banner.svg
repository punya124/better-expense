<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Better Expense banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04231a"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="pig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#glow)"/>

  <!-- faint background coins -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="1120" cy="90" r="70"/>
    <circle cx="1210" cy="330" r="46"/>
    <circle cx="70" cy="360" r="54"/>
    <circle cx="360" cy="70" r="30"/>
  </g>

  <!-- piggy bank -->
  <g transform="translate(190,225)">
    <!-- tail -->
    <path d="M-96 -6 q-30 -8 -24 -30 q5 -20 26 -14" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
    <!-- ear -->
    <path d="M-34 -52 l-16 -34 l40 18 Z" fill="#34d399"/>
    <!-- legs -->
    <rect x="-58" y="54" width="20" height="28" rx="7" fill="#0f9d6f"/>
    <rect x="18" y="54" width="20" height="28" rx="7" fill="#0f9d6f"/>
    <!-- body -->
    <ellipse cx="0" cy="0" rx="98" ry="68" fill="url(#pig)"/>
    <!-- snout -->
    <ellipse cx="92" cy="14" rx="27" ry="23" fill="#6ee7b7"/>
    <circle cx="85" cy="8" r="4.5" fill="#065f46"/>
    <circle cx="100" cy="8" r="4.5" fill="#065f46"/>
    <!-- eye -->
    <circle cx="36" cy="-16" r="6.5" fill="#04231a"/>
    <!-- coin slot -->
    <rect x="-8" y="-74" width="48" height="10" rx="5" fill="#04231a"/>
  </g>
  <!-- coin dropping into the slot -->
  <g transform="translate(206,120)">
    <circle r="17" fill="#fbbf24"/>
    <circle r="10" fill="none" stroke="#f59e0b" stroke-width="3"/>
  </g>
  <g transform="translate(158,150)" opacity="0.9">
    <circle r="11" fill="#fcd34d"/>
    <circle r="6.5" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  </g>
  <g transform="translate(300,168)" opacity="0.9">
    <circle r="13" fill="#fbbf24"/>
    <circle r="7.5" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  </g>

  <!-- wordmark -->
  <text x="470" y="196" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="1.5" fill="#ffffff">BETTER EXPENSE</text>
  <text x="472" y="252" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#6ee7b7">Save first. Get rewarded.</text>
  <text x="472" y="296" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#a7f3d0">A local-first savings tracker that turns putting money aside into a game.</text>

  <!-- accent rule -->
  <rect x="474" y="322" width="120" height="5" rx="2.5" fill="#34d399"/>
  <text x="612" y="330" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#6ee7b7" letter-spacing="3">PWA · OFFLINE-FIRST · NO ACCOUNTS</text>
</svg>
